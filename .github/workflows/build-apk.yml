name: Compilar My Cycle+ Android

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao (ex.: 1.1.0). Vazio = a do app/build.gradle.kts"
        required: false
        default: ""
      publicar:
        description: "Publicar o APK numa Release (v<versao>)"
        type: boolean
        required: false
        default: false
  release:
    types: [published]
  push:
    paths:
      - "my-cycle-android.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: my-cycle-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extrair ZIP e compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Obter ficheiros do repositorio
        uses: actions/checkout@v5

      - name: Localizar e verificar o ZIP do projeto
        shell: bash
        run: |
          set -eo pipefail
          ZIP_FILE="$(find . -type f -iname 'my-cycle-android*.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Nao encontrei my-cycle-android.zip no repositorio."
            echo "Ficheiros ZIP encontrados:"
            find . -type f -iname '*.zip' -not -path './.git/*' -print || true
            echo "Ficheiros na raiz:"
            ls -la
            exit 1
          fi

          if ! unzip -tq "$ZIP_FILE" >/dev/null; then
            echo "::error::$ZIP_FILE esta danificado ou nao e um ZIP valido."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "ZIP valido: $ZIP_FILE"

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu ja traz o Android SDK (ANDROID_HOME).
      # So instalamos o que faltar, e uma falha aqui nao pára o build.
      - name: Preparar Android SDK
        shell: bash
        run: |
          set +e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK em: $SDK"
          ls "$SDK/platforms" 2>/dev/null
          ls "$SDK/build-tools" 2>/dev/null

          SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"

          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null 2>&1
              "$SDKM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" || \
                echo "::warning::Nao consegui instalar android-34 com o sdkmanager."
            else
              echo "::warning::sdkmanager nao encontrado."
            fi
          fi
          exit 0

      # O projeto nao inclui gradlew; o AGP 8.5.2 precisa de Gradle 8.7+.
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Extrair e localizar o projeto dentro do ZIP
        shell: bash
        run: |
          set -eo pipefail
          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q -o "$ZIP_FILE" -d extracted_project

          SETTINGS_FILE="$(find extracted_project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Nao encontrei settings.gradle(.kts) dentro do ZIP."
            find extracted_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle(.kts) nao existe em $PROJECT_DIR."
            exit 1
          fi

          # Mais memoria para o Gradle/Kotlin e sem daemon
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
            echo "android.useAndroidX=true"
          } >> "$PROJECT_DIR/gradle.properties"

          # Aponta o Gradle para o SDK
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $PROJECT_DIR"

      - name: Definir versao do aplicativo
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSAO: ${{ github.event.inputs.versao }}
        run: |
          set -eo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::Nao encontrei $GRADLE_FILE."
            exit 1
          fi

          VERSION=""
          if [ -n "${RELEASE_TAG:-}" ]; then
            VERSION="${RELEASE_TAG#[vV]}"
          elif [ -n "${INPUT_VERSAO:-}" ]; then
            VERSION="${INPUT_VERSAO#[vV]}"
          else
            VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n 1 || true)"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::warning::Versao vazia ou invalida; sera usada 1.0.0."
            VERSION="1.0.0"
          fi

          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"$VERSION\"/" "$GRADLE_FILE"
          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = ${GITHUB_RUN_NUMBER}/" "$GRADLE_FILE"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versao definida: $VERSION"
          grep -nE "versionName|versionCode" "$GRADLE_FILE" || true

      - name: Compilar APK debug
        shell: bash
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/mycycle-debug.log"

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::A compilacao terminou sem produzir APK debug."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/MyCycle-debug.apk"

      # O release e assinado com a chave de debug (configurado no build.gradle.kts).
      - name: Compilar APK release
        shell: bash
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/mycycle-release.log"

          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -n "$APK" ]; then
            cp "$APK" "$GITHUB_WORKSPACE/dist/MyCycle-release.apk"
          else
            echo "::warning::Nao foi encontrado APK release; o APK debug continuara disponivel."
          fi

      - name: Disponibilizar APK em Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: MyCycle-APK-${{ env.APP_VERSION }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK numa Release
        if: github.event_name == 'release' || github.event.inputs.publicar == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eo pipefail
          TAG="${RELEASE_TAG:-v$APP_VERSION}"
          APK_TO_PUBLISH="dist/MyCycle-release.apk"

          if [ ! -f "$APK_TO_PUBLISH" ]; then
            APK_TO_PUBLISH="dist/MyCycle-debug.apk"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_TO_PUBLISH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_TO_PUBLISH" --repo "$GITHUB_REPOSITORY" \
              --title "My Cycle+ $APP_VERSION" \
              --notes "Compilacao automatica do My Cycle+ $APP_VERSION."
          fi

          echo "APK publicado na Release $TAG"

      # Mostra o erro real como anotacao vermelha no topo do run.
      - name: Mostrar diagnostico se a compilacao falhar
        if: failure()
        shell: bash
        run: |
          for LOG in "$RUNNER_TEMP/mycycle-debug.log" "$RUNNER_TEMP/mycycle-release.log"; do
            if [ -f "$LOG" ]; then
              echo "===== RESUMO DOS ERROS ($(basename "$LOG")) ====="
              ERR="$(grep -E "What went wrong|Could not resolve|Could not find|Unresolved reference|^e: |error:|FAILURE:" -A3 "$LOG" | head -30 | tr '\n' ' ' || true)"
              [ -n "$ERR" ] && echo "::error title=Erro de compilacao::${ERR:0:900}"
              grep -E "What went wrong|Could not resolve|Could not find|Unresolved reference|^e: |FAILURE:" -A4 "$LOG" | tail -100 || true
            fi
          done
